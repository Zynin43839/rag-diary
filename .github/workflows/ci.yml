# CI for the two deployable projects.
#
# The full QA checklist (`.qa/checklist.json`) runs locally, not here: the docs
# set it verifies is private and intentionally gitignored, so a CI checkout does
# not contain those files.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bun install
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun test
      - name: Build
        run: bun run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun test

  e2e:
    # Smoke checks against the deployed app. They answer one question: can a user
    # still sign in and switch language after this push?
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: bun run test:e2e
        env:
          CI: '1'
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://rag-diary-app.vercel.app' }}
